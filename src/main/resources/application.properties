spring.application.name=DistributedPaymentsSystem

# ?? Server ???????????????????????????????????????????????????????
server.port=8080


# ?? PostgreSQL ????????????????????????????????????????????????????
spring.datasource.url=jdbc:postgresql://localhost:5432/bank_db
spring.datasource.username=bank_user
spring.datasource.password=bank_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ?? JPA / Hibernate ???????????????????????????????????????????????
# validate = Hibernate checks schema matches entities but does NOT alter it
# Flyway manages all schema changes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ?? Flyway ????????????????????????????????????????????????????????
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ?? Jackson ???????????????????????????????????????????????????????
# Return dates as "2024-01-15T10:30:00" not as a timestamp number

#spring.jackson.serialization.write-dates-as-timestamps=false

# ?? Actuator ?????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ?? Logging ??????????????????????????????????????????????????????
logging.level.com.bankapi=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG


# ?? Phase 2: JWT ??????????????????????????????????????????????????
# Secret key used to sign tokens ? must be 256+ bits for HS256
# In production: use an environment variable, never commit to Git
app.jwt.secret=3f8a92b1c4d7e6f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4
# Token expiry: 86400000ms = 24 hours
app.jwt.expiration-ms=86400000